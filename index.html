<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>planet.planet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #e8e8e8;
    font-family: ui-monospace, monospace;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    padding: 1.25rem 1.5rem;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    z-index: 10;
    pointer-events: none;
    mix-blend-mode: difference;
  }

  main {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .lane {
    overflow: hidden;
    width: 100%;
    display: flex;
    align-items: center;
  }

  /* irregular row heights instead of three equal thirds */
  .lane:nth-child(1) { flex: 0 0 42%; }
  .lane:nth-child(2) { flex: 0 0 21%; }
  .lane:nth-child(3) { flex: 0 0 37%; }

  .track {
    display: flex;
    align-items: center;
    width: max-content;
    height: 100%;
    animation: scroll-left 34s linear infinite;
  }

  .lane.reverse .track {
    animation-name: scroll-right;
  }

  .track:hover {
    animation-play-state: paused;
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  @keyframes scroll-right {
    from { transform: translateX(-50%); }
    to { transform: translateX(0); }
  }

  a.box {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    color: #e8e8e8;
    text-decoration: none;
    border: 1px solid #2c2c2c;
    border-radius: 6px;
    background: #111;
    letter-spacing: 0.01em;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  a.box:hover {
    border-color: #888;
    background: #1a1a1a;
    transform: rotate(0deg) !important;
  }

  /* irregular sizes, irregular gaps, and hung-frame stagger (off-center + slight tilt), per lane */
  .lane1 .box:nth-child(4n+1) { width: 27vw; height: 96%; font-size: 1.7rem; margin-right: 2.8vw; align-self: center;    transform: rotate(-1deg); }
  .lane1 .box:nth-child(4n+2) { width: 10vw; height: 50%; font-size: 0.95rem; margin-right: 0.6vw; align-self: flex-start; transform: rotate(2deg); }
  .lane1 .box:nth-child(4n+3) { width: 16vw; height: 74%; font-size: 1.15rem; margin-right: 3.6vw; align-self: flex-end;   transform: rotate(-1.5deg); }
  .lane1 .box:nth-child(4n+4) { width: 7vw;  height: 34%; font-size: 0.8rem;  margin-right: 1.2vw; align-self: center;    transform: rotate(1.5deg); }

  .lane2 .box:nth-child(4n+1) { width: 12vw; height: 68%; font-size: 1rem;    margin-right: 0.8vw; align-self: flex-end;   transform: rotate(-2deg); }
  .lane2 .box:nth-child(4n+2) { width: 24vw; height: 96%; font-size: 1.5rem;  margin-right: 2.4vw; align-self: center;    transform: rotate(1deg); }
  .lane2 .box:nth-child(4n+3) { width: 8vw;  height: 42%; font-size: 0.8rem;  margin-right: 3.4vw; align-self: flex-start; transform: rotate(2deg); }
  .lane2 .box:nth-child(4n+4) { width: 15vw; height: 80%; font-size: 1.2rem;  margin-right: 1vw;   align-self: center;    transform: rotate(-1deg); }

  .lane3 .box:nth-child(4n+1) { width: 23vw; height: 90%; font-size: 1.5rem;  margin-right: 1.8vw; align-self: flex-start; transform: rotate(1.5deg); }
  .lane3 .box:nth-child(4n+2) { width: 9vw;  height: 40%; font-size: 0.85rem; margin-right: 3.2vw; align-self: flex-end;   transform: rotate(-2deg); }
  .lane3 .box:nth-child(4n+3) { width: 29vw; height: 98%; font-size: 1.7rem;  margin-right: 0.7vw; align-self: center;    transform: rotate(-1deg); }
  .lane3 .box:nth-child(4n+4) { width: 11vw; height: 55%; font-size: 0.95rem; margin-right: 2.6vw; align-self: flex-start; transform: rotate(2deg); }
</style>
</head>
