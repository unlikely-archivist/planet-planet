<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>planet.planet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #e8e8e8;
    font-family: ui-monospace, monospace;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    padding: 1.25rem 1.5rem;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    z-index: 10;
    pointer-events: none;
    mix-blend-mode: difference;
  }

  main {
    height: 100vh;
    width: 100vw;
    display: grid;
    gap: 6px;
    padding: 6px;
    grid-template-columns: repeat(6, 1fr);
    grid-template-rows: repeat(4, 1fr);
    grid-template-areas:
      "a a b c c c"
      "a a d d e e"
      "f f f g g h"
      "f f f g g h";
  }

  a.box {
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    color: #e8e8e8;
    text-decoration: none;
    border: 1px solid #2c2c2c;
    background: #111;
    letter-spacing: 0.01em;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
  }

  a.box:hover {
    border-color: #888;
    background: #1a1a1a;
    transform: scale(0.985);
  }

  .box1 { grid-area: a; font-size: 1.4rem; background: #14110c; }
  .box2 { grid-area: b; font-size: 0.8rem; background: #0e1211; }
  .box3 { grid-area: c; font-size: 1rem; background: #11101a; }
  .box4 { grid-area: d; font-size: 0.85rem; background: #1a1010; }
  .box5 { grid-area: e; font-size: 0.9rem; background: #0f1620; }
  .box6 { grid-area: f; font-size: 1.6rem; background: #101a12; }
  .box7 { grid-area: g; font-size: 1.15rem; background: #1a1508; }
  .box8 { grid-area: h; font-size: 0.75rem; background: #150c1a; }

  @media (max-width: 700px) {
    main {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: repeat(8, 1fr);
      grid-template-areas:
        "a a"
        "a a"
        "b c"
        "d e"
        "f f"
        "f f"
        "g h"
        "g h";
    }
  }
</style>
</head>
<body>
<header>planet.planet</header>
<main>
  <a class="box box1" href="pages/box-1.html">untitled</a>
  <a class="box box2" href="pages/box-2.html">untitled</a>
  <a class="box box3" href="pages/box-3.html">untitled</a>
  <a class="box box4" href="pages/box-4.html">untitled</a>
  <a class="box box5" href="pages/box-5.html">untitled</a>
  <a class="box box6" href="pages/box-6.html">untitled</a>
  <a class="box box7" href="pages/box-7.html">untitled</a>
  <a class="box box8" href="pages/box-8.html">untitled</a>
</main>
</body>
</html>
