<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>planet.planet</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #050505;
    color: #e8e8e8;
    font-family: ui-monospace, monospace;
  }

  header {
    position: fixed;
    top: 0;
    left: 0;
    padding: 1.25rem 1.5rem;
    font-size: 1.1rem;
    font-weight: 400;
    letter-spacing: 0.02em;
    z-index: 10;
    pointer-events: none;
    mix-blend-mode: difference;
  }

  main {
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .lane {
    overflow: hidden;
    width: 100%;
    flex: 1;
    display: flex;
    align-items: center;
  }

  .track {
    display: flex;
    align-items: center;
    width: max-content;
    height: 100%;
    animation: scroll-left 34s linear infinite;
  }

  .lane.reverse .track {
    animation-name: scroll-right;
  }

  .track:hover {
    animation-play-state: paused;
  }

  @keyframes scroll-left {
    from { transform: translateX(0); }
    to { transform: translateX(-50%); }
  }

  @keyframes scroll-right {
    from { transform: translateX(-50%); }
    to { transform: translateX(0); }
  }

  a.box {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 1rem;
    color: #e8e8e8;
    text-decoration: none;
    border: 1px solid #2c2c2c;
    border-radius: 6px;
    background: #111;
    letter-spacing: 0.01em;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  a.box:hover {
    border-color: #888;
    background: #1a1a1a;
  }

  /* irregular sizes + irregular gaps, per lane */
  .lane1 .box:nth-child(4n+1) { width: 26vw; height: 92%; font-size: 1.6rem; margin-right: 2.5vw; }
  .lane1 .box:nth-child(4n+2) { width: 12vw; height: 55%; font-size: 1rem;   margin-right: 0.8vw; }
  .lane1 .box:nth-child(4n+3) { width: 18vw; height: 78%; font-size: 1.2rem; margin-right: 3.2vw; }
  .lane1 .box:nth-child(4n+4) { width: 9vw;  height: 40%; font-size: 0.9rem; margin-right: 1.4vw; }

  .lane2 .box:nth-child(4n+1) { width: 14vw; height: 60%; font-size: 1.05rem; margin-right: 1vw; }
  .lane2 .box:nth-child(4n+2) { width: 30vw; height: 88%; font-size: 1.7rem; margin-right: 2vw; }
  .lane2 .box:nth-child(4n+3) { width: 10vw; height: 35%; font-size: 0.9rem; margin-right: 3vw; }
  .lane2 .box:nth-child(4n+4) { width: 20vw; height: 70%; font-size: 1.25rem; margin-right: 1.2vw; }

  .lane3 .box:nth-child(4n+1) { width: 22vw; height: 82%; font-size: 1.4rem; margin-right: 1.6vw; }
  .lane3 .box:nth-child(4n+2) { width: 11vw; height: 45%; font-size: 0.95rem; margin-right: 3vw; }
  .lane3 .box:nth-child(4n+3) { width: 28vw; height: 95%; font-size: 1.6rem; margin-right: 0.9vw; }
  .lane3 .box:nth-child(4n+4) { width: 13vw; height: 58%; font-size: 1rem;   margin-right: 2.2vw; }
</style>
</head>
